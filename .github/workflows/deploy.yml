name: Sync projects and deploy
on:
  schedule: [{ cron: '0 */6 * * *' }]   # every 6 hours; edit to change refresh interval
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/sync-projects.mjs
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}', GH_USER: EbadHussain20, INCLUDE_FORKS: 'false' }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: d
        uses: actions/deploy-pages@v4
